[project]
name = "breedframe"
version = "0.1.0"
description = "A local, evidence-grounded dog-photo agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "torch>=2.6,<3", "torchvision>=0.29,<1",
  "transformers>=5.10.1,<6", "httpx>=0.28,<1", "psutil>=7,<8"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
